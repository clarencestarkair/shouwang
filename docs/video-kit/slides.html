<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #333; }
  section { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #fafbfc; color: #16181d;
    font-family: "PingFang SC", sans-serif; padding: 110px 140px; margin-bottom: 20px;
    background-image: linear-gradient(to right, rgba(22,24,29,.045) 1px, transparent 1px), linear-gradient(to bottom, rgba(22,24,29,.045) 1px, transparent 1px); background-size: 64px 64px; }
  .serif { font-family: "PingFang SC", sans-serif; font-weight: 600; }
  .kicker { color: #1f6feb; font-size: 28px; font-weight: 600; letter-spacing: 1px; }
  h1 { font-family: "PingFang SC", sans-serif; font-weight: 600; font-size: 92px; line-height: 1.1; letter-spacing: -2px; margin-top: 24px; }
  h2 { font-family: "PingFang SC", sans-serif; font-weight: 600; font-size: 64px; letter-spacing: -1px; margin-top: 18px; }
  .muted { color: #4b505b; }
  .seal { position: absolute; display: grid; place-items: center; border: 14px solid #b8352a; border-radius: 16px; color: #b8352a;
    font-family: "Songti SC", serif; font-weight: 900; transform: rotate(-8deg); }
  .seal::after { content: ""; position: absolute; inset: 10px; border: 3px solid #b8352a; border-radius: 8px; }
  .logo { width: 110px; height: 110px; }
  .row { display: grid; gap: 56px; }
  .pain { background: #fff; border: 2px solid #e3e5ea; border-radius: 28px; padding: 36px; box-shadow: 0 20px 50px -30px rgba(22,24,29,.25); }
  .pain .n { color: #7c818c; font-size: 26px; font-weight: 600; }
  .pain h3 { font-size: 42px; font-weight: 600; letter-spacing: -0.5px; margin: 12px 0 14px; }
  .pain p { font-size: 27px; line-height: 1.65; color: #4b505b; }
  .box { background: #fff; border: 2px solid #e3e5ea; border-radius: 24px; box-shadow: 0 16px 40px -28px rgba(22,24,29,.3); padding: 26px 30px; font-size: 27px; line-height: 1.5; }
  .box b { display: block; font-size: 32px; margin-bottom: 8px; }
  .pine { background: #fff; border-color: #e3e5ea; }
  .pine b { color: #16181d; }
  .red { background: #fdeceb; border-color: #f6c9c6; }
  .red b { color: #d93a35; }
  .amber { background: #eaf1fe; border-color: #c9dbfb; }
  .arrow { font-size: 44px; color: #b4b8c0; align-self: center; text-align: center; }
  table { border-collapse: collapse; width: 100%; font-size: 32px; }
  th, td { padding: 20px 24px; border-bottom: 2px solid #e3e5ea; text-align: left; }
  th { background: #f2f3f6; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .g { color: #16a34a; font-weight: 700; } .r { color: #d93a35; font-weight: 700; }
  pre { background: #16181d; color: #e6e8ec; border-radius: 22px; padding: 34px 40px; font: 26px/1.6 Menlo, monospace; white-space: pre-wrap; }
  pre .c { color: #8b93a1; } pre .k { color: #7aa7ff; }
</style></head><body>
